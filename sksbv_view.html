<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0b5d1e">
    <title>SKSBV Committee - Misbahul Uloom</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary: #0b5d1e;
            --primary-light: #1a7a30;
            --secondary: #f39c12;
            --accent: #2ecc71;
            --bg: #f4f7f6;
            --white: #ffffff;
            --text: #2c3e50;
            --text-muted: #7f8c8d;
            --shadow: 0 10px 40px rgba(0,0,0,0.06);
            --radius-lg: 30px;
            --radius-md: 20px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 0;
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 60px 20px;
            text-align: center;
            border-bottom: 6px solid var(--secondary);
            box-shadow: 0 4px 30px rgba(0,0,0,0.1);
            position: relative;
        }

        .header h1 {
            margin: 0;
            font-size: clamp(1.8rem, 5vw, 2.5rem);
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .header p {
            margin: 10px 0 0;
            opacity: 0.9;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            font-weight: 400;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .main-section {
            margin-bottom: 60px;
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .section-header {
            background: var(--white);
            color: var(--primary);
            display: block;
            width: fit-content;
            padding: 12px 35px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            margin: 0 auto 40px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            border: 2px solid var(--primary);
            letter-spacing: 1px;
        }

        .committee-box {
            background: var(--white);
            border-radius: var(--radius-lg);
            padding: 50px 30px;
            box-shadow: var(--shadow);
            margin-bottom: 40px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 40px 20px;
            justify-items: center;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        .box-title {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--primary);
            margin-top: -20px;
            margin-bottom: 20px;
            opacity: 0.5;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .member-card {
            width: 100%;
            max-width: 240px;
            text-align: center;
            padding: 20px 15px;
            transition: var(--transition);
            border-radius: var(--radius-md);
            background: transparent;
        }

        .member-card:hover {
            transform: translateY(-10px);
            background: rgba(11, 93, 30, 0.02);
        }

        .pos-label {
            font-size: 0.75rem;
            font-weight: 900;
            color: var(--secondary);
            text-transform: uppercase;
            margin-bottom: 15px;
            display: block;
            letter-spacing: 1.5px;
            background: rgba(243, 156, 18, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            width: fit-content;
            margin-left: auto;
            margin-right: auto;
        }

        .photo-container {
            width: 140px;
            height: 140px;
            margin: 0 auto 20px;
            position: relative;
            z-index: 1;
        }

        .photo-container::before {
            content: '';
            position: absolute;
            inset: -8px;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            border-radius: 50%;
            z-index: -1;
            opacity: 0.2;
            transition: var(--transition);
        }

        .member-card:hover .photo-container::before {
            opacity: 0.5;
            transform: scale(1.05) rotate(15deg);
        }

        .member-photo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--white);
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            background: #eee;
        }

        .member-name {
            font-size: 1.2rem;
            font-weight: 800;
            color: var(--text);
            margin: 0 0 6px;
            text-transform: capitalize;
            letter-spacing: -0.5px;
        }

        .member-class {
            font-size: 0.85rem;
            color: var(--text-muted);
            font-weight: 600;
            display: block;
        }

        /* Tier Specifics */
        .tier-patrons {
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            background: linear-gradient(to bottom, #ffffff, #fcfcfc);
            border: 2px solid rgba(11, 93, 30, 0.05);
        }
        
        .tier-patrons .member-card { max-width: 300px; }
        .tier-patrons .photo-container { width: 170px; height: 170px; }
        .tier-patrons .member-name { font-size: 1.4rem; }

        .tier-office {
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        }

        /* Loading & UI Elements */
        .loading-state {
            text-align: center;
            padding: 100px 20px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 6px solid rgba(11, 93, 30, 0.1);
            border-top: 6px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            margin: 0 auto 25px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .back-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--primary);
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(11, 93, 30, 0.3);
            z-index: 100;
            transition: var(--transition);
        }

        .back-btn:hover {
            transform: scale(1.1) rotate(-10deg);
            background: var(--secondary);
            box-shadow: 0 10px 25px rgba(243, 156, 18, 0.3);
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .header { padding: 40px 20px; }
            .container { padding: 20px 15px; }
            .committee-box { 
                padding: 40px 15px; 
                gap: 30px 10px;
                grid-template-columns: repeat(2, 1fr);
            }
            .section-header { font-size: 1rem; padding: 10px 25px; }
            .tier-patrons, .tier-office {
                grid-template-columns: 1fr;
            }
            .tier-patrons .member-card, .tier-office .member-card {
                max-width: 100%;
            }
            .member-card { padding: 15px 5px; }
            .photo-container { width: 120px; height: 120px; }
            .member-name { font-size: 1.1rem; }
            .pos-label { font-size: 0.7rem; }
        }

        @media (max-width: 480px) {
            .committee-box {
                grid-template-columns: 1fr;
            }
            .photo-container { width: 140px; height: 140px; }
            .member-card { max-width: 100%; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>SKSBV UNIT COMMITTEE</h1>
    <p>Misbahul Uloom Madrasa, Peruvana</p>
    <div style="margin-top: 15px; font-size: 1.2rem; font-weight: 600; opacity: 0.8;">Committee 2026-27</div>
</div>

<div class="container">
    <div id="loading" class="loading-state">
        <div class="spinner"></div>
        <p>Fetching Committee Details...</p>
    </div>

    <div id="mainContent" style="display: none;">
        <!-- Patrons -->
        <div class="main-section" id="section-patrons">
            <div class="committee-box tier-patrons" id="box-patrons"></div>
        </div>

        <!-- Executive -->
        <div class="main-section" id="section-executive">
            <div class="section-header">Executive Committee</div>
            
            <div class="committee-box tier-office" id="box-office">
                <div class="box-title">Main Bearers</div>
            </div>

            <div class="committee-box" id="box-vps">
                <div class="box-title">Vice Presidents</div>
            </div>

            <div class="committee-box" id="box-jss">
                <div class="box-title">Joint Secretaries</div>
            </div>
        </div>

        <!-- Coordinators -->
        <div class="main-section" id="section-coordinators">
            <div class="section-header">Coordinators</div>
            <div class="committee-box" id="box-coords"></div>
            <div class="committee-box" id="box-members">
                <div class="box-title">Numbers</div>
            </div>
        </div>

        <!-- Counselors -->
        <div class="main-section" id="section-counselors">
            <div class="section-header">Counselors</div>
            <div class="committee-box" id="box-counselors"></div>
        </div>
    </div>
</div>

<a href="index.html" class="back-btn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</a>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCe98Gw-si7idO0m8y5xbLLG8Z2HC3RCKE",
        authDomain: "mum-new-id.firebaseapp.com",
        projectId: "mum-new-id",
        storageBucket: "mum-new-id.firebasestorage.app",
        messagingSenderId: "794343464244",
        appId: "1:794343464244:web:f9083036490e3609bf1961"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const hierarchy = [
        {
            container: 'box-patrons',
            positions: [
                { id: 'chairman', label: 'Chairman' },
                { id: 'convener', label: 'Convener' }
            ]
        },
        {
            container: 'box-office',
            positions: [
                { id: 'president', label: 'President' },
                { id: 'g_secretary', label: 'General Secretary' },
                { id: 'treasurer', label: 'Treasurer' },
                { id: 'w_secretary', label: 'Working Secretary' }
            ]
        },
        {
            container: 'box-vps',
            positions: [
                { id: 'v_president', label: 'Vice President', count: 3 }
            ]
        },
        {
            container: 'box-jss',
            positions: [
                { id: 'j_secretary', label: 'Joint Secretary', count: 3 }
            ]
        },
        {
            container: 'box-coords',
            positions: [
                { id: 'adab_coord', label: 'Adab Coordinator' },
                { id: 'alif_coord', label: 'Alif Coordinator' },
                { id: 'khidma_coord', label: 'Khidma Coordinator' },
                { id: 'tech_admin', label: 'Tech Admin' }
            ]
        },
        {
            container: 'box-members',
            positions: [
                { id: 'member', label: 'Member', count: 3 }
            ]
        },
        {
            container: 'box-counselors',
            positions: [
                { id: 'councilor', label: 'Councilor', count: 3 }
            ]
        }
    ];

    async function loadCommittee() {
        try {
            const doc = await db.collection("sksbv_committee").doc("current").get();
            if (doc.exists) {
                renderCommittee(doc.data());
            } else {
                document.getElementById('loading').innerHTML = '<p>No committee data found.</p>';
            }
        } catch (e) {
            console.error(e);
            document.getElementById('loading').innerHTML = '<p>Error loading data.</p>';
        }
    }

    function renderCommittee(data) {
        hierarchy.forEach(group => {
            const container = document.getElementById(group.container);
            let hasMembers = false;

            group.positions.forEach(pos => {
                const count = pos.count || 1;
                for (let i = 1; i <= count; i++) {
                    const key = count > 1 ? `${pos.id}_${i}` : pos.id;
                    const member = data[key];
                    
                    if (member && member.name) {
                        hasMembers = true;
                        const card = document.createElement('div');
                        card.className = 'member-card';
                        card.innerHTML = `
                            <span class="pos-label">${pos.label}</span>
                            <div class="photo-container">
                                <img src="${member.photo}" class="member-photo" alt="${member.name}">
                            </div>
                            <h3 class="member-name">${member.name}</h3>
                            <div class="member-class">${member.class ? 'Std - ' + member.class : 'SKSBV UNIT'}</div>
                        `;
                        container.appendChild(card);
                    }
                }
            });

            // Hide section if empty
            if (!hasMembers) {
                const section = container.closest('.main-section');
                if (section && section.querySelectorAll('.member-card').length === 0) {
                    section.style.display = 'none';
                } else {
                    container.style.display = 'none';
                }
            }
        });

        document.getElementById('loading').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
    }

    loadCommittee();
</script>

</body>
</html>
