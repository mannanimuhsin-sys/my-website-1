<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKSBV Committee - Misbahul Uloom</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary: #0b5d1e;
            --secondary: #f39c12;
            --accent: #2ecc71;
            --bg: #f4f7f6;
            --white: #ffffff;
            --text: #2c3e50;
            --shadow: 0 10px 30px rgba(0,0,0,0.08);
            --glass: rgba(255, 255, 255, 0.9);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 0;
            color: var(--text);
            line-height: 1.6;
        }

        .header {
            background: linear-gradient(135deg, var(--primary), #1a7a30);
            color: white;
            padding: 50px 20px;
            text-align: center;
            border-bottom: 5px solid var(--secondary);
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .header h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header p {
            margin: 8px 0 0;
            opacity: 0.9;
            font-size: 1rem;
            font-weight: 300;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .main-section {
            margin-bottom: 50px;
        }

        .section-header {
            background: var(--primary);
            color: white;
            display: inline-block;
            padding: 10px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(11, 93, 30, 0.2);
            position: relative;
            left: 50%;
            transform: translateX(-50%);
        }

        .committee-box {
            background: var(--white);
            border-radius: 30px;
            padding: 40px;
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            border: 1px solid rgba(0,0,0,0.03);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
        }

        .box-title {
            width: 100%;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--primary);
            margin-top: -20px;
            margin-bottom: 20px;
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .member-card {
            width: 220px;
            text-align: center;
            padding: 20px 10px;
            transition: 0.3s;
        }

        .member-card:hover {
            transform: translateY(-5px);
        }

        .pos-label {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--primary);
            text-transform: uppercase;
            margin-bottom: 15px;
            display: block;
            letter-spacing: 0.5px;
        }

        .photo-container {
            width: 140px;
            height: 140px;
            margin: 0 auto 15px;
            position: relative;
        }

        .photo-container::after {
            content: '';
            position: absolute;
            inset: -5px;
            border: 3px solid var(--secondary);
            border-radius: 50%;
            opacity: 0.3;
        }

        .member-photo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .member-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #2c3e50;
            margin: 0 0 5px;
            text-transform: capitalize;
        }

        .member-class {
            font-size: 0.8rem;
            color: #7f8c8d;
            font-weight: 500;
            background: #f0f2f1;
            padding: 3px 12px;
            border-radius: 20px;
            display: inline-block;
        }

        /* Tier Specifics */
        .tier-patrons .member-card { width: 260px; }
        .tier-patrons .photo-container { width: 160px; height: 160px; }
        .tier-patrons .member-name { font-size: 1.3rem; }

        .tier-office .member-card { width: 240px; }
        .tier-office .member-name { font-size: 1.2rem; }

        .loading-state {
            text-align: center;
            padding: 100px 20px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #eee;
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .back-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: var(--primary);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            z-index: 100;
            transition: 0.3s;
        }

        .back-btn:hover { transform: scale(1.1); background: var(--secondary); }

        @media (max-width: 600px) {
            .header h1 { font-size: 1.6rem; }
            .committee-box { padding: 20px 10px; }
            .member-card { width: 45%; }
            .tier-patrons .member-card, .tier-office .member-card { width: 100%; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>SKSBV UNIT COMMITTEE</h1>
    <p>Misbahul Uloom Madrasa, Peruvana</p>
</div>

<div class="container">
    <div id="loading" class="loading-state">
        <div class="spinner"></div>
        <p>Fetching Committee Details...</p>
    </div>

    <div id="mainContent" style="display: none;">
        <!-- Patrons -->
        <div class="main-section" id="section-patrons">
            <div class="committee-box tier-patrons" id="box-patrons"></div>
        </div>

        <!-- Executive -->
        <div class="main-section" id="section-executive">
            <div class="section-header">Executive Committee</div>
            
            <div class="committee-box tier-office" id="box-office">
                <div class="box-title">Main Bearers</div>
            </div>

            <div class="committee-box" id="box-vps">
                <div class="box-title">Vice Presidents</div>
            </div>

            <div class="committee-box" id="box-jss">
                <div class="box-title">Joint Secretaries</div>
            </div>
        </div>

        <!-- Coordinators -->
        <div class="main-section" id="section-coordinators">
            <div class="section-header">Coordinators</div>
            <div class="committee-box" id="box-coords"></div>
            <div class="committee-box" id="box-members">
                <div class="box-title">Numbers</div>
            </div>
        </div>

        <!-- Counselors -->
        <div class="main-section" id="section-counselors">
            <div class="section-header">Counselors</div>
            <div class="committee-box" id="box-counselors"></div>
        </div>
    </div>
</div>

<a href="index.html" class="back-btn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</a>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCe98Gw-si7idO0m8y5xbLLG8Z2HC3RCKE",
        authDomain: "mum-new-id.firebaseapp.com",
        projectId: "mum-new-id",
        storageBucket: "mum-new-id.firebasestorage.app",
        messagingSenderId: "794343464244",
        appId: "1:794343464244:web:f9083036490e3609bf1961"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const hierarchy = [
        {
            container: 'box-patrons',
            positions: [
                { id: 'chairman', label: 'Chairman' },
                { id: 'convener', label: 'Convener' }
            ]
        },
        {
            container: 'box-office',
            positions: [
                { id: 'president', label: 'President' },
                { id: 'g_secretary', label: 'General Secretary' },
                { id: 'treasurer', label: 'Treasurer' },
                { id: 'w_secretary', label: 'Working Secretary' }
            ]
        },
        {
            container: 'box-vps',
            positions: [
                { id: 'v_president', label: 'Vice President', count: 3 }
            ]
        },
        {
            container: 'box-jss',
            positions: [
                { id: 'j_secretary', label: 'Joint Secretary', count: 3 }
            ]
        },
        {
            container: 'box-coords',
            positions: [
                { id: 'adab_coord', label: 'Adab Coordinator' },
                { id: 'alif_coord', label: 'Alif Coordinator' },
                { id: 'khidma_coord', label: 'Khidma Coordinator' },
                { id: 'tech_admin', label: 'Tech Admin' }
            ]
        },
        {
            container: 'box-members',
            positions: [
                { id: 'member', label: 'Member', count: 3 }
            ]
        },
        {
            container: 'box-counselors',
            positions: [
                { id: 'councilor', label: 'Councilor', count: 3 }
            ]
        }
    ];

    async function loadCommittee() {
        try {
            const doc = await db.collection("sksbv_committee").doc("current").get();
            if (doc.exists) {
                renderCommittee(doc.data());
            } else {
                document.getElementById('loading').innerHTML = '<p>No committee data found.</p>';
            }
        } catch (e) {
            console.error(e);
            document.getElementById('loading').innerHTML = '<p>Error loading data.</p>';
        }
    }

    function renderCommittee(data) {
        hierarchy.forEach(group => {
            const container = document.getElementById(group.container);
            let hasMembers = false;

            group.positions.forEach(pos => {
                const count = pos.count || 1;
                for (let i = 1; i <= count; i++) {
                    const key = count > 1 ? `${pos.id}_${i}` : pos.id;
                    const member = data[key];
                    
                    if (member && member.name) {
                        hasMembers = true;
                        const card = document.createElement('div');
                        card.className = 'member-card';
                        card.innerHTML = `
                            <span class="pos-label">${pos.label}</span>
                            <div class="photo-container">
                                <img src="${member.photo}" class="member-photo" alt="${member.name}">
                            </div>
                            <h3 class="member-name">${member.name}</h3>
                            <div class="member-class">${member.class || 'SKSBV UNIT'}</div>
                        `;
                        container.appendChild(card);
                    }
                }
            });

            // Hide section if empty
            if (!hasMembers) {
                const section = container.closest('.main-section');
                if (section && section.querySelectorAll('.member-card').length === 0) {
                    section.style.display = 'none';
                } else {
                    container.style.display = 'none';
                }
            }
        });

        document.getElementById('loading').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
    }

    loadCommittee();
</script>

</body>
</html>
