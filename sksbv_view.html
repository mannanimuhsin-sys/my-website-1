<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKSBV Committee - Misbahul Uloom</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary: #0b5d1e;
            --secondary: #f39c12;
            --accent: #2ecc71;
            --bg: #f8f9fa;
            --white: #ffffff;
            --text: #2c3e50;
            --shadow: 0 15px 40px rgba(0,0,0,0.1);
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            margin: 0;
            padding: 0;
            color: var(--text);
            overflow-x: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary), #1a7a30);
            color: white;
            padding: 60px 20px;
            text-align: center;
            border-radius: 0 0 50px 50px;
            box-shadow: var(--shadow);
            position: relative;
        }

        .header h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header p {
            margin: 10px 0 0;
            opacity: 0.9;
            font-size: 1.1rem;
            font-weight: 300;
        }

        .container {
            max-width: 1100px;
            margin: -40px auto 40px;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            margin: 40px 0 20px;
            font-weight: 800;
            color: var(--primary);
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            padding-bottom: 10px;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 3px;
            background: var(--secondary);
            border-radius: 2px;
        }

        .committee-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            justify-content: center;
        }

        .top-execs-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
        }

        .member-card {
            background: var(--white);
            border-radius: 25px;
            overflow: hidden;
            box-shadow: var(--shadow);
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-align: center;
            border: 1px solid rgba(0,0,0,0.05);
            position: relative;
            width: 280px;
        }

        .member-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
        }

        .card-accent {
            height: 80px;
            background: linear-gradient(135deg, var(--secondary), #e67e22);
        }

        .member-photo-wrap {
            width: 130px;
            height: 130px;
            margin: -65px auto 15px;
            position: relative;
            z-index: 2;
        }

        .member-photo {
            width: 100%;
            height: 100%;
            border-radius: 35px;
            object-fit: cover;
            border: 5px solid white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        .pos-badge {
            background: var(--primary);
            color: white;
            padding: 5px 15px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        .member-name {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0 0 5px;
            color: var(--primary);
            padding: 0 10px;
        }

        .member-class {
            font-size: 0.85rem;
            color: #7f8c8d;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .card-footer {
            background: #fdfdfd;
            padding: 15px;
            border-top: 1px solid #f5f5f5;
            font-size: 0.75rem;
            color: #bdc3c7;
        }

        .loading-state {
            text-align: center;
            padding: 80px 20px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #eee;
            border-top: 5px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .back-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: var(--primary);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            z-index: 100;
            transition: 0.3s;
        }

        .back-btn:hover { transform: scale(1.1); background: var(--secondary); }

        @media (max-width: 600px) {
            .header h1 { font-size: 1.8rem; }
            .container { margin-top: -30px; }
            .member-card { width: 100%; }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>SKSBV UNIT COMMITTEE</h1>
    <p>Misbahul Uloom Madrasa, Peruvana</p>
</div>

<div class="container">
    <div id="loading" class="loading-state">
        <div class="spinner"></div>
        <p>കമ്മറ്റി വിവരം ലോഡ് ചെയ്യുന്നു...</p>
    </div>

    <div id="mainContent" style="display: none;">
        <!-- Patrons Section (Chairman, Convener) -->
        <div class="section-title">Patrons</div>
        <div class="top-execs-grid" id="patronsList"></div>

        <!-- Executive Section -->
        <div class="section-title">Executive Committee</div>
        <div class="committee-grid" id="execList"></div>

        <!-- Coordinators Section -->
        <div class="section-title">Coordinators</div>
        <div class="committee-grid" id="coordList"></div>

        <!-- Councilors & Members Section -->
        <div class="section-title">Councilors & Members</div>
        <div class="committee-grid" id="membersList"></div>
    </div>
</div>

<a href="index.html" class="back-btn">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
</a>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCe98Gw-si7idO0m8y5xbLLG8Z2HC3RCKE",
        authDomain: "mum-new-id.firebaseapp.com",
        projectId: "mum-new-id",
        storageBucket: "mum-new-id.firebasestorage.app",
        messagingSenderId: "794343464244",
        appId: "1:794343464244:web:f9083036490e3609bf1961"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const positionConfig = {
        'chairman': { name: 'Chairman', color: 'linear-gradient(135deg, #FFD700, #F39C12)', section: 'patrons' },
        'convener': { name: 'Convener', color: 'linear-gradient(135deg, #FFD700, #F39C12)', section: 'patrons' },
        
        'president': { name: 'President', color: 'linear-gradient(135deg, #1e3c72, #2a5298)', section: 'exec' },
        'v_president': { name: 'Vice President', color: 'linear-gradient(135deg, #2c5364, #203a43)', section: 'exec' },
        'g_secretary': { name: 'General Secretary', color: 'linear-gradient(135deg, #1e3c72, #2a5298)', section: 'exec' },
        'secretary': { name: 'Secretary', color: 'linear-gradient(135deg, #2c5364, #203a43)', section: 'exec' },
        'j_secretary': { name: 'Joint Secretary', color: 'linear-gradient(135deg, #2c5364, #203a43)', section: 'exec' },
        'treasurer': { name: 'Treasurer', color: 'linear-gradient(135deg, #eb3349, #f45c43)', section: 'exec' },
        'w_secretary': { name: 'Working Secretary', color: 'linear-gradient(135deg, #11998e, #38ef7d)', section: 'exec' },
        
        'adab_coord': { name: 'Adab Coordinator', color: 'linear-gradient(135deg, #5f2c82, #49a09d)', section: 'coord' },
        'tech_admin': { name: 'Tech Admin', color: 'linear-gradient(135deg, #000428, #004e92)', section: 'coord' },
        'alif_coord': { name: 'Alif Coordinator', color: 'linear-gradient(135deg, #5f2c82, #49a09d)', section: 'coord' },
        'khidma_coord': { name: 'Khidma Coordinator', color: 'linear-gradient(135deg, #5f2c82, #49a09d)', section: 'coord' },
        
        'councilor': { name: 'Councilor', color: 'linear-gradient(135deg, #3498db, #2980b9)', section: 'members' },
        'member': { name: 'Member', color: 'linear-gradient(135deg, #3498db, #2980b9)', section: 'members' }
    };

    async function loadCommittee() {
        try {
            const doc = await db.collection("sksbv_committee").doc("current").get();
            if (doc.exists) {
                renderCommittee(doc.data());
            } else {
                document.getElementById('loading').innerHTML = '<p>No committee data found.</p>';
            }
        } catch (e) {
            console.error(e);
            document.getElementById('loading').innerHTML = '<p>Error loading data.</p>';
        }
    }

    function renderCommittee(data) {
        const sections = {
            patrons: document.getElementById('patronsList'),
            exec: document.getElementById('execList'),
            coord: document.getElementById('coordList'),
            members: document.getElementById('membersList')
        };
        
        Object.values(sections).forEach(s => s.innerHTML = '');

        // Sort keys to maintain order (Chairman/Convener first, then others)
        // We can just iterate through our positionConfig sections if we want strict order
        const sectionOrder = ['patrons', 'exec', 'coord', 'members'];
        
        sectionOrder.forEach(secKey => {
            Object.keys(data).forEach(key => {
                let matchKey = key;
                if (key.includes('_')) {
                    const parts = key.split('_');
                    const lastPart = parts[parts.length - 1];
                    if (!isNaN(lastPart)) {
                        // It's a numbered key like v_president_1 or councilor_1
                        matchKey = parts.slice(0, -1).join('_');
                    }
                }
                
                const config = positionConfig[matchKey] || { name: 'Member', color: 'linear-gradient(135deg, #3498db, #2980b9)', section: 'members' };
                
                if (config.section === secKey) {
                    const member = data[key];
                    const cardHtml = `
                        <div class="member-card">
                            <div class="card-accent" style="background: ${config.color}"></div>
                            <div class="member-photo-wrap">
                                <img src="${member.photo}" class="member-photo" alt="${member.name}">
                            </div>
                            <div class="pos-badge">${config.name}</div>
                            <h3 class="member-name">${member.name}</h3>
                            <div class="member-class">${member.class ? 'Class: ' + member.class : 'SKSBV UNIT'}</div>
                            <div class="card-footer">
                                SKSBV UNIT COMMITTEE 2026
                            </div>
                        </div>
                    `;
                    sections[secKey].innerHTML += cardHtml;
                }
            });
        });

        // Hide empty sections
        sectionOrder.forEach(secKey => {
            if (sections[secKey].innerHTML === '') {
                sections[secKey].previousElementSibling.style.display = 'none';
            }
        });

        document.getElementById('loading').style.display = 'none';
        document.getElementById('mainContent').style.display = 'block';
    }

    loadCommittee();
</script>

</body>
</html>
