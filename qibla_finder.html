<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0"/>

<title>Qibla Finder - Google Style</title>

<!-- Font Awesome for sleek modern icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<!-- Google Fonts for Outfit modern premium typography -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Outfit', sans-serif;
-webkit-tap-highlight-color: transparent;
}

body, html {
width: 100%;
height: 100%;
margin: 0;
padding: 0;
overflow: hidden;
background: #0d1e15; /* Dark calibration base color */
color: white;
user-select: none;
}

/* Full Screen Panoramic Container */
.viewfinder-container {
position: absolute;
inset: 0;
width: 100%;
height: 100%;
background: radial-gradient(circle at center, #7bd1f9 0%, #3ca8ec 100%);
display: flex;
flex-direction: column;
align-items: center;
justify-content: space-between;
padding: 30px 20px;
z-index: 2;
opacity: 0;
transition: opacity 0.8s ease;
overflow: hidden;
}

.viewfinder-container.active {
opacity: 1;
}

/* Camera Stream Overlay */
#camera-stream {
position: absolute;
inset: 0;
width: 100%;
height: 100%;
object-fit: cover;
z-index: 1;
display: none;
pointer-events: none;
}

/* Horizon line */
.horizon-line {
position: absolute;
top: 55%;
left: 0;
width: 100%;
height: 2px;
background: rgba(255,255,255,0.3);
z-index: 5;
box-shadow: 0 0 10px rgba(255,255,255,0.2);
}

/* Scrolling Horizon tick ruler */
.horizon-ticks {
position: absolute;
top: 55%;
left: 50%;
height: 35px;
width: 3600px; /* Long strip */
transform: translate3d(-50%, -100%, 0);
display: flex;
align-items: flex-end;
justify-content: center;
gap: 10px;
z-index: 4;
opacity: 0.6;
will-change: transform;
pointer-events: none;
}

.tick-mark {
width: 2px;
height: 12px;
background: white;
}
.tick-mark.major {
height: 24px;
width: 3px;
background: #ffd700;
position: relative;
}
.tick-mark.major::after {
content: attr(data-deg);
position: absolute;
top: -20px;
left: 50%;
transform: translateX(-50%);
font-size: 10px;
font-weight: 700;
color: white;
}

/* IMMERSIVE COMPASS HUD TARGET */
.hud-target {
position: absolute;
top: 55%;
left: 50%;
transform: translate(-50%, -50%);
width: 170px;
height: 170px;
border: 2px dashed rgba(255, 255, 255, 0.4);
border-radius: 50%;
z-index: 6;
pointer-events: none;
display: flex;
align-items: center;
justify-content: center;
transition: border-color 0.4s, transform 0.4s;
}

.hud-target.aligned {
border-color: #0aff8d;
border-style: solid;
box-shadow: 0 0 30px rgba(10, 255, 141, 0.4);
transform: translate(-50%, -50%) scale(1.08);
}

.hud-target::after {
content: '';
position: absolute;
width: 12px;
height: 12px;
border-radius: 50%;
background: rgba(255,255,255,0.6);
}
.hud-target.aligned::after {
background: #0aff8d;
box-shadow: 0 0 10px #0aff8d;
}

/* FLOATING QIBLA PIN - MATCHING SCREENSHOT 2 */
.qibla-pin {
position: absolute;
top: 55%;
left: 50%;
transform: translate3d(-50%, -100%, 0);
display: flex;
flex-direction: column;
align-items: center;
z-index: 10;
will-change: transform, opacity;
opacity: 0;
pointer-events: none;
transition: opacity 0.4s ease;
}

.pin-bubble {
width: 120px;
height: 120px;
background: #0084ff; /* Google Blue Pin */
border-radius: 50% 50% 50% 0;
transform: rotate(-45deg);
display: flex;
align-items: center;
justify-content: center;
box-shadow: 0 12px 35px rgba(0, 132, 255, 0.45);
border: 4px solid #ffffff;
transition: background 0.4s ease, box-shadow 0.4s ease;
animation: floatPin 2.2s infinite alternate ease-in-out;
}

.viewfinder-container.aligned .pin-bubble {
background: #0aff8d; /* Glowing green pin when aligned! */
box-shadow: 0 12px 40px rgba(10, 255, 141, 0.6);
}

.kaaba-container {
transform: rotate(45deg); /* Counter-rotate to keep Kaaba upright */
width: 80px;
height: 80px;
display: flex;
align-items: center;
justify-content: center;
}

/* Beautiful mathematically precise Kaaba SVG */
.kaaba-icon {
width: 100%;
height: 100%;
filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
}

.pin-shadow {
width: 25px;
height: 6px;
background: rgba(0,0,0,0.25);
border-radius: 50%;
margin-top: 10px;
filter: blur(1.5px);
animation: floatShadow 2.2s infinite alternate ease-in-out;
}

@keyframes floatPin {
0% { transform: rotate(-45deg) translate(0, 0); }
100% { transform: rotate(-45deg) translate(-6px, -6px); }
}

@keyframes floatShadow {
0% { transform: scale(1); opacity: 0.6; }
100% { transform: scale(0.7); opacity: 0.25; }
}

/* Top bar controls */
.top-controls {
width: 100%;
display: flex;
justify-content: space-between;
align-items: center;
z-index: 12;
}

.circle-btn {
width: 48px;
height: 48px;
border-radius: 50%;
background: rgba(255,255,255,0.15);
backdrop-filter: blur(10px);
-webkit-backdrop-filter: blur(10px);
border: 1px solid rgba(255,255,255,0.25);
display: flex;
align-items: center;
justify-content: center;
color: white;
font-size: 20px;
cursor: pointer;
transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.15);
box-shadow: 0 4px 15px rgba(0,0,0,0.15);
}

.circle-btn:active {
transform: scale(0.9);
}

.circle-btn.active {
background: #0084ff;
border-color: #0084ff;
box-shadow: 0 0 15px rgba(0, 132, 255, 0.5);
color: white;
}

.lang-switch {
background: rgba(255,255,255,0.15);
backdrop-filter: blur(10px);
-webkit-backdrop-filter: blur(10px);
border: 1px solid rgba(255,255,255,0.25);
padding: 8px 18px;
border-radius: 25px;
font-size: 13px;
font-weight: 700;
cursor: pointer;
color: white;
box-shadow: 0 4px 15px rgba(0,0,0,0.1);
transition: 0.3s;
}
.lang-switch:hover {
background: rgba(255,255,255,0.3);
}

/* Large dynamic texts at the top */
.text-hud {
text-align: center;
z-index: 12;
max-width: 90%;
margin-top: 20px;
}

.text-hud h1 {
font-size: 28px;
font-weight: 800;
text-shadow: 0 2px 10px rgba(0,0,0,0.2);
margin-bottom: 6px;
line-height: 1.25;
transition: color 0.3s;
}

.text-hud p {
font-size: 13px;
font-weight: 600;
opacity: 0.85;
text-shadow: 0 1px 6px rgba(0,0,0,0.2);
}

/* Offscreen navigational guidance indicators */
.guide-arrow {
position: absolute;
top: 55%;
transform: translateY(-50%);
font-size: 38px;
color: white;
z-index: 10;
display: none;
animation: arrowPulse 0.8s infinite alternate ease-in-out;
text-shadow: 0 2px 10px rgba(0,0,0,0.3);
pointer-events: none;
}

#guide-left { left: 20px; }
#guide-right { right: 20px; }

@keyframes arrowPulse {
0% { transform: translateY(-50%) scale(1); opacity: 0.4; }
100% { transform: translateY(-50%) scale(1.2); opacity: 0.9; }
}

.guide-arrow.active {
display: block;
}

/* Google-style bottom card for sharing and status */
.bottom-panel {
width: 100%;
max-width: 400px;
background: rgba(255, 255, 255, 0.12);
backdrop-filter: blur(25px);
-webkit-backdrop-filter: blur(25px);
border: 1px solid rgba(255, 255, 255, 0.2);
border-radius: 28px;
padding: 16px;
display: flex;
flex-direction: column;
align-items: center;
z-index: 12;

}

.hold-flat-hint {

gap: 15px;

.share-btn {

height: 46px;

background: rgba(255,255,255,0.2);

align-items: center;
justify-content: center;
color: white;
font-size: 16px;

.share-btn:hover {

color: #0084ff;
transform: translateY(-3px);
box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.share-btn:active {

}

/* CALIBRATION / WELCOME SCREEN - MATCHING SCREENSHOT 1 */
.calibration-screen {
position: absolute;
inset: 0;
width: 100%;
height: 100%;
background: linear-gradient(180deg, #021a10, #04311e, #010d08);

flex-direction: column;
align-items: center;
justify-content: space-between;

.calibration-screen.fade-out {

}

.cal-header {
text-align: center;
}

.cal-header h2 {
font-size: 26px;
font-weight: 800;
color: white;
letter-spacing: 0.5px;

align-items: center;
justify-content: center;

.cal-header p {

color: #b3ccc0;

/* Glowing Target Circle */
.target-ring-wrap {
position: relative;
width: 220px;
height: 220px;

.target-circle {

height: 180px;

@keyframes rotateRing {

box-shadow: 
0 0 25px rgba(212, 175, 55, 0.25),

}

@keyframes pulseRing {
0% { transform: scale(0.95); box-shadow: 0 0 15px rgba(212,175,55,0.2); }
100% { transform: scale(1.05); box-shadow: 0 0 35px rgba(212,175,55,0.55); }

.phone-tilt-icon {
font-size: 42px;
color: #ffd700;
animation: tiltPhone 3s infinite alternate ease-in-out;
text-shadow: 0 0 10px rgba(255,215,0,0.5);

@keyframes tiltPhone {
0% { transform: rotate(-15deg); }
50% { transform: rotate(15deg); }
100% { transform: rotate(-15deg); }

.cal-prompt-box {
text-align: center;
max-width: 320px;
}

.cal-prompt-box p {
font-size: 16px;
line-height: 1.5;
font-weight: 600;
color: #e3f2ea;
margin-bottom: 25px;
text-shadow: 0 2px 5px rgba(0,0,0,0.2);

.btn-cal {
width: 100%;
padding: 16px;
border: none;
border-radius: 20px;
font-size: 16px;
font-weight: 700;
cursor: pointer;
background: linear-gradient(135deg, #ffd700, #d4af37);

align-items: center;
justify-content: center;
gap: 8px;
animation: pulseButton 1.5s infinite alternate;

@keyframes pulseButton {

100% { box-shadow: 0 10px 25px rgba(212, 175, 55, 0.7); transform: scale(1.02); }

.btn-cal:hover {

}

/* Manual Compass Fallback control inside bottom HUD */
.manual-wrap {
width: 100%;
background: rgba(255,255,255,0.06);
border-radius: 16px;

margin-top: 10px;

.manual-wrap p {
font-size: 10px;
color: #ffd700;

gap: 8px;
}

.toast.active {

}

</style>

<body>

<script>
// Kaaba Coordinates
const kaabaLat = 21.4225;
const kaabaLng = 39.8262;

// Initial Coordinates & State Variables
let userLat = 11.0720; // Default Malappuram Kerala
let userLng = 76.0740;
let distanceToKaaba = 4082;
let qiblaAngle = 292.4; 
let currentHeading = 0;
let hasSensor = false;
let isAbsoluteMode = false;
let wasAligned = false;
let isCameraActive = false;
let currentLanguage = 'ml'; // Default Malayalam for Madrasa

// Natural translations variables
const langTexts = {
    ml: {
        title: "ഖിബ്‌ല ഫൈൻഡർ",
        calibratePrompt: "കൃത്യമായ ഖിബ്‌ല ദിശ ലഭിക്കാൻ കോമ്പസ് ഓൺ ചെയ്യുക.",
        calibrateBtn: "കോമ്പസ് ഓൺ ചെയ്യുക",
        facingQibla: "നിങ്ങൾ ഖിബ്‌ലയ്ക്ക് അഭിമുഖമാണ്",
        distanceText: "കഅബ ഈ ദിശയിൽ {dist} കി.മീ അകലെയാണ്.",
        turnLeft: "◀ ഇടത്തോട്ട് തിരിയുക ({deg}°)",
        turnRight: "വലത്തോട്ട് തിരിയുക ▶ ({deg}°)",
        holdFlat: "കൃത്യമായ ദിശയ്ക്ക് ഫോൺ കൈയിൽ നേരെ പരത്തിപ്പിടിക്കുക.",
        desktopSim: "ലാപ്‌ടോപ്പ് സിമുലേഷൻ: റൊട്ടേറ്റ് ചെയ്യാൻ സ്ലൈഡർ തിരിക്കുക"
    },
    en: {
        title: "Qibla Finder",
        calibratePrompt: "Let's get your compass pointing in the right direction.",
        calibrateBtn: "Calibrate compass",
        facingQibla: "You're facing the Qibla",
        distanceText: "Kaaba is {dist} km in this direction.",
        turnLeft: "◀ Turn Left ({deg}°)",
        turnRight: "Turn Right ▶ ({deg}°)",
        holdFlat: "Hold phone flat for accurate direction.",
        desktopSim: "Desktop Simulation: Slide to rotate compass"
    }
};

function toRadians(deg){ return deg * Math.PI / 180; }
function toDegrees(rad){ return rad * 180 / Math.PI; }

function calculateQibla(lat, lng){
    const uLat = toRadians(lat);
    const uLng = toRadians(lng);
    const kLat = toRadians(kaabaLat);
    const kLng = toRadians(kaabaLng);
    const lngDiff = kLng - uLng;

    const y = Math.sin(lngDiff);
    const x = Math.cos(uLat) * Math.tan(kLat) - Math.sin(uLat) * Math.cos(lngDiff);
    let direction = toDegrees(Math.atan2(y, x));
    return (direction + 360) % 360;
}

function calculateDistance(lat1, lon1, lat2, lon2) {
    const R = 6371; 
    const dLat = toRadians(lat2 - lat1);
    const dLon = toRadians(lon2 - lon1);
    const a = 
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRadians(lat1)) * Math.cos(toRadians(lat2)) * 
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
}

// Generate Ruler degrees scale dynamically
function generateHorizonTicks() {
    const ticksWrap = document.getElementById("horizon-ticks");
    ticksWrap.innerHTML = "";
    // Build ticks for full compass circle (0 to 360 degrees)
    for (let i = 0; i < 360; i += 5) {
        const tick = document.createElement("div");
        if (i % 30 === 0) {
            tick.className = "tick-mark major";
            tick.setAttribute("data-deg", i + "°");
        } else {
            tick.className = "tick-mark";
        }
        ticksWrap.appendChild(tick);
    }
}

// Synthesize nice harmonic chime
let audioCtx = null;
function playChime() {
    try {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
        osc.frequency.exponentialRampToValueAtTime(783.99, audioCtx.currentTime + 0.18); // G5
        gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.7);

        osc.start(audioCtx.currentTime);
        osc.stop(audioCtx.currentTime + 0.7);
    } catch(e) {
        console.error(e);
    }
}

// Immersive sliding VR Renderer
function updatePanoramicDOM() {
    const pin = document.getElementById("qibla-pin");
    const ticks = document.getElementById("horizon-ticks");
    const hudTarget = document.getElementById("hud-target");
    const viewfinder = document.getElementById("hud-viewfinder");
    const h1 = document.getElementById("heading-h1");
    const subP = document.getElementById("sub-p");
    
    // 1. Sliding compass ticks
    // Each tick is 10px + gap. Let's shift it so that center is physical heading
    const scaleFactor = 15; // pixels per degree
    const centerOffset = -currentHeading * scaleFactor;
    ticks.style.transform = `translate3d(calc(-50% + ${centerOffset}px), -100%, 0)`;

    // 2. Relative angular offset to Kaaba
    let diff = qiblaAngle - currentHeading;
    if (diff > 180) diff -= 360;
    if (diff < -180) diff += 360;

    // Visibility Field of view (+- 45 degrees fits standard viewport width)
    const viewWidth = window.innerWidth;
    const pixelsPerDegree = viewWidth / 90; // Fit 90 degrees inside viewport width
    const pinOffset = diff * pixelsPerDegree;

    const arrowLeft = document.getElementById("guide-left");
    const arrowRight = document.getElementById("guide-right");

    if (Math.abs(diff) <= 45) {
        pin.style.opacity = 1;
        pin.style.pointerEvents = "auto";
        // Glide map pin horizontally along the horizon line
        pin.style.transform = `translate3d(calc(-50% + ${pinOffset}px), -100%, 0)`;
        arrowLeft.classList.remove("active");
        arrowRight.classList.remove("active");
    } else {
        // Off-screen
        pin.style.opacity = 0;
        pin.style.pointerEvents = "none";
        if (diff > 0) {
            arrowRight.classList.add("active");
            arrowLeft.classList.remove("active");
        } else {
            arrowLeft.classList.add("active");
            arrowRight.classList.remove("active");
        }
    }

    // 3. Perfect Alignment Trigger (Mecca target within +- 3.5 degrees)
    const texts = langTexts[currentLanguage];
    if (Math.abs(diff) <= 3.5) {
        hudTarget.classList.add("aligned");
        viewfinder.classList.add("aligned");
        h1.innerHTML = `<span style="color:#0aff8d;">${texts.facingQibla}</span>`;
        subP.innerHTML = texts.distanceText.replace("{dist}", Math.round(distanceToKaaba).toLocaleString());
        
        // Background glow
        if (!isCameraActive) {
            viewfinder.style.background = "radial-gradient(circle at center, #35eba2 0%, #037c52 100%)";
        }

        if (!wasAligned) {
            playChime();
            if (navigator.vibrate) {
                navigator.vibrate([200, 100, 200]);
            }
            wasAligned = true;
        }
    } else {
        hudTarget.classList.remove("aligned");
        viewfinder.classList.remove("aligned");
        
        // Return standard blue background
        if (!isCameraActive) {
            viewfinder.style.background = "radial-gradient(circle at center, #7bd1f9 0%, #3ca8ec 100%)";
        }

        if (diff > 0) {
            h1.innerHTML = texts.turnRight.replace("{deg}", Math.round(Math.abs(diff)));
        } else {
            h1.innerHTML = texts.turnLeft.replace("{deg}", Math.round(Math.abs(diff)));
        }
        subP.innerHTML = texts.distanceText.replace("{dist}", Math.round(distanceToKaaba).toLocaleString());
        wasAligned = false;
    }

    // Sync manual range slider
    const manualSlider = document.getElementById("manual-slider");
    if (manualSlider) {
        manualSlider.value = Math.round(currentHeading);
    }
}

// SYNCHRONOUS INITIALISATION FLOW - Resolves iOS/Chrome restrictions
async function startFinder() {
    // 1. Hide Calibration Overlay Screen
    document.getElementById("cal-screen").classList.add("fade-out");
    document.getElementById("hud-viewfinder").classList.add("active");
    
    // 2. Synchronously trigger orientation permissions
    await requestOrientationAccess();
    
    // 3. Simultaneously request high-accuracy location
    requestGeolocation();
}

async function requestOrientationAccess() {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
            const state = await DeviceOrientationEvent.requestPermission();
            if (state === 'granted') {
                bindCompassSensors();
                showToast("കോമ്പസ് സജീവമായി! 🟢");
            } else {
                showToast("കോമ്പസ് ഓഫ്‌ലൈൻ. Manual Mode.");
                enableManualSimulation();
            }
        } catch(e) {
            console.error("iOS Permission fail", e);
            enableManualSimulation();
        }
    } else {
        // Android standard auto binding
        bindCompassSensors();
    }
}

function bindCompassSensors() {
    const handleAbsolute = (e) => {
        if (e.alpha !== null) {
            isAbsoluteMode = true;
            hasSensor = true;
            currentHeading = 360 - e.alpha; // standard W3C alpha is counter-clockwise
            document.getElementById("manual-controls").style.display = "none";
            updatePanoramicDOM();
        }
    };

    const handleStandard = (e) => {
        if (isAbsoluteMode) return; 

        let heading = null;
        if (e.webkitCompassHeading !== undefined) {
            heading = e.webkitCompassHeading; // iOS Safari absolute compass
        } else if (e.absolute === true && e.alpha !== null) {
            heading = 360 - e.alpha;
        }

        if (heading !== null) {
            hasSensor = true;
            currentHeading = heading;
            document.getElementById("manual-controls").style.display = "none";
            updatePanoramicDOM();
        }
    };

    window.addEventListener("deviceorientationabsolute", handleAbsolute, true);
    window.addEventListener("deviceorientation", handleStandard, true);

    // Timeout sensor verification
    setTimeout(() => {
        if (!hasSensor) {
            enableManualSimulation();
        }
    }, 1500);
}

function enableManualSimulation() {
    hasSensor = false;
    document.getElementById("manual-controls").style.display = "block";
    updatePanoramicDOM();
}

function onSliderChange(val) {
    currentHeading = parseFloat(val);
    updatePanoramicDOM();
}

// GPS geolocation
function requestGeolocation() {
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
            function(position) {
                userLat = position.coords.latitude;
                userLng = position.coords.longitude;
                qiblaAngle = calculateQibla(userLat, userLng);
                distanceToKaaba = calculateDistance(userLat, userLng, kaabaLat, kaabaLng);
                
                showToast("ലൊക്കേഷൻ കണ്ടെത്തി!");
                updatePanoramicDOM();
            },
            function(err) {
                console.warn(err);
                fallbackMeccaCoordinates();
            },
            { enableHighAccuracy: true, timeout: 5000 }
        );
    } else {
        fallbackMeccaCoordinates();
    }
}

function fallbackMeccaCoordinates() {
    userLat = 11.0720;
    userLng = 76.0740;
    qiblaAngle = calculateQibla(userLat, userLng);
    distanceToKaaba = calculateDistance(userLat, userLng, kaabaLat, kaabaLng);
    updatePanoramicDOM();
}

// BREATHTAKING CAMERA AR TOGGLE - MATCHING GOOGLE FINDER
function toggleCamera() {
    const video = document.getElementById("camera-stream");
    const camBtn = document.getElementById("camera-toggle");
    
    if (isCameraActive) {
        // Stop Camera
        if (video.srcObject) {
            video.srcObject.getTracks().forEach(track => track.stop());
        }
        video.style.display = "none";
        camBtn.classList.remove("active");
        isCameraActive = false;
        
        // Restore blue gradient
        document.getElementById("hud-viewfinder").style.background = "radial-gradient(circle at center, #7bd1f9 0%, #3ca8ec 100%)";
        showToast("ക്യാമറ ഓഫ് ചെയ്തു.");
    } else {
        // Start Camera overlay
        showToast("ക്യാമറ കണക്ട് ചെയ്യുന്നു...");
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(stream => {
            video.srcObject = stream;
            video.style.display = "block";
            camBtn.classList.add("active");
            isCameraActive = true;
            
            // Remove colored background to see through camera
            document.getElementById("hud-viewfinder").style.background = "transparent";
            showToast("ക്യാമറ ആക്റ്റീവ് ആയി! 📷");
        })
        .catch(err => {
            console.error(err);
            showToast("ക്യാമറ ലഭ്യമായില്ല.");
        });
    }
}

    currentLanguage = (currentLanguage === 'ml') ? 'en' : 'ml';

// Drag horizontal panorama to rotate manually (For desktop/non-sensor)
let isDragging = false;
let startX = 0;
let startHeading = 0;

const view = document.getElementById("hud-viewfinder");
view.addEventListener("mousedown", startDrag);
view.addEventListener("touchstart", startDrag, { passive: true });

function startDrag(e) {
    if (hasSensor) return;
    isDragging = true;
    startX = e.touches ? e.touches[0].clientX : e.clientX;
    startHeading = currentHeading;

    document.addEventListener("mousemove", doDrag);
    document.addEventListener("touchmove", doDrag, { passive: false });
    document.addEventListener("mouseup", stopDrag);
    document.addEventListener("touchend", stopDrag);
}

function doDrag(e) {
    if (!isDragging) return;
    if (e.cancelable) e.preventDefault();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    
    // Scale horizontal drag to degrees (approx 5px per degree)
    const diffX = clientX - startX;
    let newHeading = (startHeading - diffX / 5 + 360) % 360;
    currentHeading = newHeading;
    updatePanoramicDOM();
}

function stopDrag() {
    isDragging = false;
    document.removeEventListener("mousemove", doDrag);
    document.removeEventListener("touchmove", doDrag);
    document.removeEventListener("mouseup", stopDrag);
    document.removeEventListener("touchend", stopDrag);
}

// Visual Toast helper
function showToast(message) {
    let toast = document.getElementById("toast");
    if (!toast) {
        toast = document.createElement("div");
        toast.id = "toast";
        toast.className = "toast";
        document.body.appendChild(toast);
    }
    toast.innerHTML = `<i class="fa-solid fa-circle-check"></i> ${message}`;
    toast.classList.add("active");
    setTimeout(() => {
        toast.classList.remove("active");
    }, 2500);
}
