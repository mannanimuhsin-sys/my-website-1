<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Outfit', sans-serif;
-webkit-tap-highlight-color: transparent;
}

body{
background: linear-gradient(180deg, #012413, #013e22, #00190c);
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
color:white;
padding: 20px 10px;
overflow-x:hidden;
position: relative;
}

/* Beautiful ambient glowing circles */
.bg1{
position:absolute;
width:300px;
height:300px;
background:rgba(212, 175, 55, 0.15);
border-radius:50%;
top:-50px;
left:-80px;
filter:blur(60px);
z-index: 1;
pointer-events: none;
}

.bg2{
position:absolute;
width:300px;
height:300px;
background:rgba(10, 255, 141, 0.08);
border-radius:50%;
bottom:-80px;
right:-80px;
filter:blur(60px);
z-index: 1;
pointer-events: none;
}

.container{
width:100%;
max-width:410px;
position:relative;
z-index: 2;
}

.card{
background: rgba(255, 255, 255, 0.04);
backdrop-filter: blur(20px);
-webkit-backdrop-filter: blur(20px);
border: 1px solid rgba(255, 255, 255, 0.08);
border-radius: 32px;
padding: 24px;
box-shadow: 0 20px 50px rgba(0,0,0,0.4);
position: relative;
overflow: hidden;
transition: border-color 0.5s ease;
}

.card.aligned {
border-color: rgba(10, 255, 141, 0.3);
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.title{
font-size:24px;
font-weight:700;
color: #fff;
display: flex;
align-items: center;
gap: 6px;
}

.top-controls {
display: flex;
align-items: center;
gap: 8px;
}

.control-btn {
background: rgba(255, 255, 255, 0.07);
border: 1px solid rgba(255, 255, 255, 0.12);
color: white;
width: 38px;
height: 38px;
border-radius: 50%;
cursor: pointer;
display: flex;
justify-content: center;
align-items: center;
font-size: 13px;
font-weight: 600;
transition: all 0.3s ease;
}

.control-btn:hover {
background: rgba(212, 175, 55, 0.2);
border-color: #ffd700;
color: #ffd700;
transform: scale(1.05);
}

.status{
background: rgba(10, 255, 141, 0.15);
padding: 6px 12px;
border-radius: 20px;
font-size: 12px;
font-weight: 600;
color: #5cffb1;
letter-spacing: 0.5px;
box-shadow: 0 0 10px rgba(10, 255, 141, 0.1);
}

.compass-wrapper{
display:flex;
justify-content:center;
align-items:center;
margin: 15px 0 20px 0;
position: relative;
}

.compass{
position:relative;
width:280px;
height:280px;
border-radius:50%;
background: radial-gradient(circle, rgba(255, 255, 255, 0.03), rgba(0, 0, 0, 0.4));
border: 6px solid #d4af37;
box-shadow: 
0 0 25px rgba(212, 175, 55, 0.25),
inset 0 0 25px rgba(0, 0, 0, 0.5);
cursor: grab;
transition: border-color 0.4s ease, box-shadow 0.4s ease;
user-select: none;
touch-action: none;
}

.compass:active {
cursor: grabbing;
}

/* Beautiful dynamic aligned state */
.compass.aligned {
border-color: #0aff8d;
box-shadow: 
0 0 35px rgba(10, 255, 141, 0.6),
inset 0 0 30px rgba(10, 255, 141, 0.15);
animation: pulseGlow 2s infinite alternate;
}

@keyframes pulseGlow {
0% { box-shadow: 0 0 25px rgba(10, 255, 141, 0.4), inset 0 0 20px rgba(10, 255, 141, 0.1); }
100% { box-shadow: 0 0 45px rgba(10, 255, 141, 0.7), inset 0 0 40px rgba(10, 255, 141, 0.25); }
}

.compass-dial {
position: absolute;
width: 100%;
height: 100%;
will-change: transform;
transform-origin: center center;
transition: transform 0.15s cubic-bezier(0.1, 0.8, 0.3, 1);
}

.ring{
position:absolute;
inset:12px;
border: 2px dashed rgba(255, 255, 255, 0.08);
border-radius:50%;
pointer-events: none;
}

.center-dot{
position:absolute;
width:32px;
height:32px;
background: radial-gradient(circle, #ffd700, #bfa02c);
border: 3px solid #012413;
border-radius:50%;
top:50%;
left:50%;
transform:translate(-50%,-50%);
z-index:5;
box-shadow: 0 4px 10px rgba(0,0,0,0.4);
display: flex;
justify-content: center;
align-items: center;
pointer-events: none;
}

.center-dot::after {
content: '🌙';
font-size: 11px;
color: #012413;
margin-left: 1px;
}

/* Beautiful Tick Marks */
.tick {
position: absolute;
width: 2px;
background: rgba(255, 255, 255, 0.2);
top: 50%;
left: 50%;
transform-origin: center center;
pointer-events: none;
}
.tick.minor { height: 6px; width: 1px; }
.tick.medium { height: 12px; background: rgba(212, 175, 55, 0.5); }
.tick.major { height: 16px; background: #ffd700; width: 3px; }

.needle{
position:absolute;
width: 5px;
height: 105px;
background: linear-gradient(to top, rgba(212,175,55,0.1) 40%, #ffd700 40%);
top:50%;
left:50%;
transform-origin: center bottom;
transform: translate(-50%,-100%) rotate(0deg);
border-radius: 4px 4px 0 0;
z-index:4;
filter: drop-shadow(0 0 6px rgba(255,215,0,0.6));
pointer-events: none;
transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.needle::before{
content:'✦';
position:absolute;
top:-15px;
left:50%;
transform:translateX(-50%);
color:#ffd700;
font-size:14px;
text-shadow: 0 0 6px #ffd700;
}

.qibla-marker {
position: absolute;
top:50%;
left:50%;
font-size:26px;
z-index: 5;
pointer-events: none;
filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.8));
transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.direction-label{
position:absolute;
font-size:16px;
font-weight:800;
color: rgba(255, 255, 255, 0.5);
pointer-events: none;
}

.n{ top:15px; left:50%; transform:translateX(-50%); color: #ffd700; font-size: 18px; text-shadow: 0 0 8px rgba(255,215,0,0.4); }
.s{ bottom:15px; left:50%; transform:translateX(-50%);}
.e{ right:18px; top:50%; transform:translateY(-50%);}
.w{ left:18px; top:50%; transform:translateY(-50%);}

/* Stationary alignment notch at 0 degrees */
.alignment-notch {
position: absolute;
top: -8px;
left: 50%;
transform: translateX(-50%);
color: #ffd700;
font-size: 18px;
z-index: 6;
filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
pointer-events: none;
}
.compass.aligned .alignment-notch {
color: #0aff8d;
animation: pulseNotch 1.5s infinite alternate;
}

@keyframes pulseNotch {
0% { transform: translateX(-50%) scale(1); filter: drop-shadow(0 0 2px #0aff8d); }
100% { transform: translateX(-50%) scale(1.2); filter: drop-shadow(0 0 8px #0aff8d); }
}

.degree-box{
margin-top:10px;
background: rgba(255, 255, 255, 0.03);
border: 1px solid rgba(255, 255, 255, 0.05);
padding: 16px;
border-radius:20px;
text-align:center;
transition: all 0.3s ease;
}

.degree-box.aligned {
background: rgba(10, 255, 141, 0.08);
border-color: rgba(10, 255, 141, 0.25);
}

.degree{
font-size:32px;
font-weight:800;
color:#ffd700;
transition: color 0.3s ease;
}

.small{
margin-top:4px;
font-size:14px;
color:#b3ccc0;
font-weight: 500;
display: flex;
justify-content: center;
align-items: center;
gap: 5px;
}

.location{
margin-top:12px;
background: rgba(255, 255, 255, 0.02);
border: 1px solid rgba(255, 255, 255, 0.04);
padding: 12px 16px;
border-radius:18px;
font-size:13px;
line-height:1.6;
color:#b3ccc0;
text-align: center;
}

.buttons{
display:flex;
gap:10px;
margin-top:16px;
}

.btn{
flex:1;
padding:14px;
border:none;
border-radius:16px;
font-size:15px;
font-weight:700;
cursor:pointer;
transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.1);
display: flex;
justify-content: center;
align-items: center;
gap: 6px;
}

.primary{
background: linear-gradient(135deg, #ffd700, #d4af37);
color:#012413;
box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
}

.secondary{
background: rgba(255, 255, 255, 0.06);
color:white;
border: 1px solid rgba(255, 255, 255, 0.08);
}

.btn:hover{
transform:scale(1.025);
}
.btn:active{
transform:scale(0.97);
}

/* Dynamic Manual Control Sliders */
.manual-control {
margin-top: 15px;
background: rgba(212, 175, 55, 0.05);
border: 1px solid rgba(212, 175, 55, 0.15);
border-radius: 18px;
padding: 12px;
}

input[type="range"] {
-webkit-appearance: none;
appearance: none;
width: 100%;
margin-top: 8px;
}

input[type="range"]::-webkit-slider-runnable-track {
background: rgba(255, 255, 255, 0.1);
height: 6px;
border-radius: 3px;
}

input[type="range"]::-webkit-slider-thumb {
-webkit-appearance: none;
appearance: none;
background: #ffd700;
width: 16px;
height: 16px;
border-radius: 50%;
margin-top: -5px;
box-shadow: 0 0 8px rgba(255, 215, 0, 0.6);
cursor: pointer;
}

.bottom{
margin-top:20px;
display:flex;
justify-content:space-between;
}

.box{
flex:1;
background: rgba(255, 255, 255, 0.03);
border: 1px solid rgba(255, 255, 255, 0.05);
margin: 0 5px;
padding: 12px 8px;
border-radius:16px;
text-align: center;
cursor: pointer;
transition: all 0.3s ease;
}

.box:hover{
background: rgba(212, 175, 55, 0.1);
border-color: rgba(212, 175, 55, 0.3);
transform: translateY(-2px);
}

.box i{
font-size:20px;
margin-bottom:6px;
color:#ffd700;
}

.box p{
font-size:12px;
color:#b3ccc0;
font-weight: 500;
}

.footer{
text-align:center;
margin-top:20px;
font-size:12px;
color: rgba(255,255,255,0.4);
font-weight: 500;
}

/* Sleek Premium Modals */
.modal-overlay {
position: fixed;
top: 0;
left: 0;
width: 100%;
height: 100%;
background: rgba(0, 0, 0, 0.7);
backdrop-filter: blur(10px);
-webkit-backdrop-filter: blur(10px);
z-index: 100;
opacity: 0;
visibility: hidden;
transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
display: flex;
justify-content: center;
align-items: flex-end;
}

.modal-overlay.active {
opacity: 1;
visibility: visible;
}

.modal-content {
background: linear-gradient(180deg, #01311b, #00190c);
border: 1px solid rgba(212, 175, 55, 0.25);
border-radius: 30px 30px 0 0;
width: 100%;
max-width: 410px;
padding: 24px;
box-shadow: 0 -10px 40px rgba(0,0,0,0.5);
transform: translateY(100%);
transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
color: white;
}

.modal-overlay.active .modal-content {
transform: translateY(0);
}

@media (min-width: 410px) {
.modal-overlay {
align-items: center;
}
.modal-content {
border-radius: 28px;
margin: 15px;
}
}

.modal-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 18px;
}

.modal-title {
font-size: 20px;
color: #ffd700;
font-weight: 700;
}

.modal-close {
background: rgba(255, 255, 255, 0.08);
border: 1px solid rgba(255, 255, 255, 0.1);
color: white;
width: 32px;
height: 32px;
border-radius: 50%;
display: flex;
justify-content: center;
align-items: center;
cursor: pointer;
font-size: 16px;
transition: 0.3s;
}

.modal-close:hover {
background: rgba(212, 175, 55, 0.2);
border-color: #ffd700;
}

.modal-body {
font-size: 14px;
line-height: 1.6;
}

/* Toast Notification */
.toast {
position: fixed;
top: 20px;
left: 50%;
transform: translate(-50%, -100px);
background: linear-gradient(135deg, #ffd700, #d4af37);
color: #012413;
font-weight: 700;
padding: 12px 24px;
border-radius: 20px;
font-size: 13px;
z-index: 200;
box-shadow: 0 8px 30px rgba(0,0,0,0.3);
transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
pointer-events: none;
display: flex;
align-items: center;
gap: 8px;
}

.toast.active {
transform: translate(-50%, 0);
}

</style>
</head>

<div class="bottom">

</div>
<div class="box" onclick="openKaabaModal()">

</div>

<div class="footer">
Premium Madrasa Qibla Finder
</div>

</div>

</div>

<div class="modal-overlay" id="info-modal" onclick="closeModal(event)">

</div>
<div class="modal-body" id="modal-body">
<!-- Dynamic Content Injected Here -->
</div>
</div>
</div>

// Math Helpers
function toRadians(deg){ return deg * Math.PI / 180; }
function toDegrees(rad){ return rad * 180 / Math.PI; }

function calculateQibla(lat, lng){
const uLat = toRadians(lat);
const uLng = toRadians(lng);
const kLat = toRadians(kaabaLat);
const kLng = toRadians(kaabaLng);
const lngDiff = kLng - uLng;

const y = Math.sin(lngDiff);
const x = Math.cos(uLat) * Math.tan(kLat) - Math.sin(uLat) * Math.cos(lngDiff);
let direction = toDegrees(Math.atan2(y, x));
return (direction + 360) % 360;
}

// Distance Calculation (Haversine Formula)
function calculateDistance(lat1, lon1, lat2, lon2) {
const R = 6371; // Radius of Earth in km
const dLat = toRadians(lat2 - lat1);
const dLon = toRadians(lon2 - lon1);
const a = 
Math.sin(dLat / 2) * Math.sin(dLat / 2) +
Math.cos(toRadians(lat1)) * Math.cos(toRadians(lat2)) * 
Math.sin(dLon / 2) * Math.sin(dLon / 2);
const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
return R * c;
}

// Dynamically generate premium scale ticks on compass dial
function generateCompassTicks() {
const dial = document.getElementById("compass-dial");
for (let i = 0; i < 36; i++) {
const angle = i * 10;
const tick = document.createElement("div");
tick.className = "tick";
if (angle % 90 === 0) {
tick.classList.add("major");
} else if (angle % 30 === 0) {
tick.classList.add("medium");
} else {
tick.classList.add("minor");
}
tick.style.transform = `translate(-50%, -50%) rotate(${angle}deg) translateY(-120px)`;
dial.appendChild(tick);
}
}

// Web Audio API Synthesized Premium Chime
let audioCtx = null;
function playChime() {
if (isMuted) return;
try {
if (!audioCtx) {
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
if (audioCtx.state === 'suspended') {
audioCtx.resume();
}
const osc = audioCtx.createOscillator();
const gainNode = audioCtx.createGain();
osc.connect(gainNode);
gainNode.connect(audioCtx.destination);

osc.type = 'sine';
// Pleasant double-note harmonic synth chime
osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
osc.frequency.exponentialRampToValueAtTime(783.99, audioCtx.currentTime + 0.15); // G5
gainNode.gain.setValueAtTime(0.25, audioCtx.currentTime);
gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);

osc.start(audioCtx.currentTime);
osc.stop(audioCtx.currentTime + 0.8);
} catch(e) {
console.error("Audio playback error:", e);
}
}

// Update DOM elements on rotation or location change
function updateCompassDOM() {
const dial = document.getElementById("compass-dial");
const needle = document.getElementById("needle");
const qiblaMarker = document.getElementById("qibla-marker");
const facingLabel = document.getElementById("facing-label");

// Spin the dial to point 'N' to absolute North
dial.style.transform = `rotate(${-currentHeading}deg)`;

// Point the needle to the calculated Qibla bearing relative to the dial
needle.style.transform = `translate(-50%, -100%) rotate(${qiblaAngle}deg)`;

// Place the Kaaba icon target at the outer perimeter of the dial at Qibla angle
qiblaMarker.style.transform = `translate(-50%, -50%) rotate(${qiblaAngle}deg) translateY(-106px) rotate(${-qiblaAngle}deg)`;

// Compute direction difference for user alignment helper
let relAngle = (qiblaAngle - currentHeading + 360) % 360;
const minDiff = Math.min(Math.abs(currentHeading - qiblaAngle), 360 - Math.min(Math.abs(currentHeading - qiblaAngle)));

const cmp = document.getElementById("compass");
const degBox = document.getElementById("degree-box");
const card = document.getElementById("qibla-card");

if (minDiff <= 3.5) {
// Target Aligned! Trigger Glowing CSS styles and audio/haptics
cmp.classList.add("aligned");
degBox.classList.add("aligned");
card.classList.add("aligned");
document.getElementById("degree").innerHTML = qiblaAngle.toFixed(1) + "°";
facingLabel.innerHTML = `<span style="color:#0aff8d; font-weight:bold;">${getTrans('perfect')}</span>`;

if (!wasAligned) {
playChime();
if (navigator.vibrate) {
navigator.vibrate([200, 100, 200]);
}
wasAligned = true;
}
} else {
cmp.classList.remove("aligned");
degBox.classList.remove("aligned");
card.classList.remove("aligned");
document.getElementById("degree").innerHTML = qiblaAngle.toFixed(1) + "°";

// Guides user on which way to rotate
if (relAngle > 3.5 && relAngle <= 180) {
facingLabel.innerHTML = `<span style="color:#ffd700;">${getTrans('turnRight')} (${minDiff.toFixed(0)}°)</span>`;
} else {
facingLabel.innerHTML = `<span style="color:#ffd700;">${getTrans('turnLeft')} (${minDiff.toFixed(0)}°)</span>`;
}
wasAligned = false;
}

if (slider) {
slider.value = Math.round(currentHeading);
}
}

// Fallback to manual slider and drag-spin orientation
function enableManualMode() {
hasSensor = false;
document.getElementById("manual-control").style.display = "block";
document.getElementById("app-status").innerHTML = getTrans("status") === "LIVE" ? "MANUAL" : "മാനുവൽ";

}

// Drag & Spin Compass Dial (Polar math for premium mouse/touch interactions)
let isDragging = false;
let startAngle = 0;
let startHeading = 0;

compass.addEventListener("mousedown", startDrag);
compass.addEventListener("touchstart", startDrag, { passive: true });

function startDrag(e) {
if (hasSensor) return; // Prevent manual spin if sensor works
isDragging = true;
const rect = compass.getBoundingClientRect();
const centerX = rect.left + rect.width / 2;
const centerY = rect.top + rect.height / 2;
const clientX = e.touches ? e.touches[0].clientX : e.clientX;
const clientY = e.touches ? e.touches[0].clientY : e.clientY;

startAngle = Math.atan2(clientY - centerY, clientX - centerX) * 180 / Math.PI;
startHeading = currentHeading;

document.addEventListener("mousemove", doDrag);
document.addEventListener("touchmove", doDrag, { passive: false });
document.addEventListener("mouseup", stopDrag);
document.addEventListener("touchend", stopDrag);
}

function doDrag(e) {
if (!isDragging) return;
if (e.cancelable) e.preventDefault();
const rect = compass.getBoundingClientRect();
const centerX = rect.left + rect.width / 2;
const centerY = rect.top + rect.height / 2;
const clientX = e.touches ? e.touches[0].clientX : e.clientX;
const clientY = e.touches ? e.touches[0].clientY : e.clientY;

const currentAngle = Math.atan2(clientY - centerY, clientX - centerX) * 180 / Math.PI;
let angleDiff = currentAngle - startAngle;

let newHeading = (startHeading - angleDiff + 360) % 360;
currentHeading = newHeading;
updateCompassDOM();
}

function stopDrag() {
isDragging = false;
document.removeEventListener("mousemove", doDrag);
document.removeEventListener("touchmove", doDrag);
document.removeEventListener("mouseup", stopDrag);
document.removeEventListener("touchend", stopDrag);
}

// Live GPS and Bearing Lookup
function findQibla() {
if (navigator.geolocation) {
showToast(currentLang === 'en' ? "Detecting high-accuracy GPS..." : "ജിപിഎസ് ലൊക്കേഷൻ പരിശോധിക്കുന്നു...");
navigator.geolocation.getCurrentPosition(
function(position) {
userLat = position.coords.latitude;
userLng = position.coords.longitude;
gpsAccuracy = position.coords.accuracy;

qiblaAngle = calculateQibla(userLat, userLng);
distanceToKaaba = calculateDistance(userLat, userLng, kaabaLat, kaabaLng);

document.getElementById("location").innerHTML = `
📍 ${getTrans('lat')}: ${userLat.toFixed(4)}<br>
📍 ${getTrans('lng')}: ${userLng.toFixed(4)}
`;

showToast(currentLang === 'en' ? "Location Updated! Qibla Recalculated." : "ലൊക്കേഷൻ കണ്ടെത്തി! ഖിബ്‌ല ദിശ ക്രമീകരിച്ചു.");
updateCompassDOM();
requestCompassSensor();
},
function(error) {
console.warn("GPS Permission Denied, falling back to default.", error);
showToast(currentLang === 'en' ? "GPS denied. Using Kerala coordinates." : "ലൊക്കേഷൻ ലഭ്യമല്ല, കേരള ലൊക്കേഷൻ ഉപയോഗിക്കുന്നു.");
fallbackCoordinates();
requestCompassSensor();
},
{ enableHighAccuracy: true, timeout: 5000 }
);
} else {
showToast("Geolocation is not supported by your browser.");
fallbackCoordinates();
requestCompassSensor();
}
}

function fallbackCoordinates() {
// Kerala, Malappuram coordinates as perfect defaults
userLat = 11.0720;
userLng = 76.0740;
gpsAccuracy = null;
qiblaAngle = calculateQibla(userLat, userLng);
distanceToKaaba = calculateDistance(userLat, userLng, kaabaLat, kaabaLng);
updateCompassDOM();
}

// Active Compass orientation sensor tracking
async function requestCompassSensor() {
if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
// iOS Safe flow requires direct button interaction to trigger permission request
try {
const permissionState = await DeviceOrientationEvent.requestPermission();
if (permissionState === 'granted') {
activateCompassSensor();
} else {
showToast("Compass permission denied. Manual Mode active.");
enableManualMode();
}
} catch (e) {
console.error("Orientation error:", e);
enableManualMode();
}
} else {
// Android and non-iOS standard browsers
activateCompassSensor();
}
}

function activateCompassSensor() {
let orientationCallback = function(e) {
hasSensor = true;
document.getElementById("manual-control").style.display = "none";
document.getElementById("app-status").innerHTML = getTrans("status");
document.getElementById("app-status").style.background = "rgba(10, 255, 141, 0.15)";
document.getElementById("app-status").style.color = "#5cffb1";

let heading = null;
if (e.webkitCompassHeading !== undefined) {
heading = e.webkitCompassHeading;
} else if (e.alpha !== null) {
heading = 360 - e.alpha; // standard alpha is counter-clockwise
}

if (heading !== null) {
currentHeading = heading;
updateCompassDOM();
}
};

// Check and bind browser orientation absolute event
if ('ondeviceorientationabsolute' in window) {
window.addEventListener("deviceorientationabsolute", orientationCallback, true);
} else if ('ondeviceorientation' in window) {
window.addEventListener("deviceorientation", orientationCallback, true);
} else {
enableManualMode();
}

// Verify sensor actually triggers
setTimeout(() => {
if (!hasSensor) {
enableManualMode();
}
}, 1500);
}
