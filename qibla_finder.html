<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Premium Qibla Finder</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:
linear-gradient(180deg,#012b17,#014d2a,#022012);
height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
color:white;
}

.bg1{
position:absolute;
width:350px;
height:350px;
background:#d4af3730;
border-radius:50%;
top:-100px;
left:-80px;
filter:blur(50px);
}

.bg2{
position:absolute;
width:300px;
height:300px;
background:#ffffff10;
border-radius:50%;
bottom:-80px;
right:-80px;
filter:blur(50px);
}

.container{
width:100%;
max-width:420px;
padding:20px;
position:relative;
z-index:2;
}

.card{
background:rgba(255,255,255,0.06);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,0.1);
border-radius:35px;
padding:25px;
box-shadow:0 10px 40px rgba(0,0,0,0.3);
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.title{
font-size:28px;
font-weight:bold;
}

.status{
background:#0aff8d25;
padding:8px 14px;
border-radius:20px;
font-size:13px;
color:#5cffb1;
}

.compass-wrapper{
display:flex;
justify-content:center;
align-items:center;
margin-top:10px;
margin-bottom:20px;
}

.compass{
position:relative;
width:290px;
height:290px;
border-radius:50%;
background:
radial-gradient(circle,#ffffff10,#00000020);
border:10px solid #d4af37;
box-shadow:
0 0 30px rgba(212,175,55,0.5),
inset 0 0 30px rgba(255,255,255,0.05);
}

.ring{
position:absolute;
inset:15px;
border:2px dashed rgba(255,255,255,0.15);
border-radius:50%;
}

.center-dot{
position:absolute;
width:20px;
height:20px;
background:white;
border-radius:50%;
top:50%;
left:50%;
transform:translate(-50%,-50%);
z-index:5;
}

.needle{
position:absolute;
width:8px;
height:120px;
background:linear-gradient(to top,#ff0000,#ff7373);
top:50%;
left:50%;
transform-origin:center bottom;
transform:translate(-50%,-100%) rotate(0deg);
border-radius:20px;
transition:1s ease;
z-index:4;
box-shadow:0 0 20px rgba(255,0,0,0.6);
}

.needle::after{
content:'';
position:absolute;
bottom:-18px;
left:50%;
transform:translateX(-50%);
width:18px;
height:18px;
background:white;
border-radius:50%;
}

.kaaba{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
font-size:58px;
z-index:3;
}

.direction-label{
position:absolute;
font-size:18px;
font-weight:bold;
color:#fff;
}

.n{ top:12px; left:50%; transform:translateX(-50%);}
.s{ bottom:12px; left:50%; transform:translateX(-50%);}
.e{ right:15px; top:50%; transform:translateY(-50%);}
.w{ left:15px; top:50%; transform:translateY(-50%);}

.degree-box{
margin-top:20px;
background:#ffffff10;
padding:18px;
border-radius:20px;
text-align:center;
}

.degree{
font-size:32px;
font-weight:bold;
color:#ffd700;
}

.small{
margin-top:5px;
font-size:14px;
color:#ccc;
}

.location{
margin-top:15px;
background:#ffffff08;
padding:15px;
border-radius:18px;
font-size:14px;
line-height:1.7;
color:#ddd;
}

.buttons{
display:flex;
gap:12px;
margin-top:20px;
}

.btn{
flex:1;
padding:15px;
border:none;
border-radius:18px;
font-size:16px;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

.primary{
background:#d4af37;
color:black;
}

.secondary{
background:#ffffff15;
color:white;
}

.btn:hover{
transform:scale(1.03);
}

.bottom{
margin-top:25px;
display:flex;
justify-content:space-between;
text-align:center;
}

.box{
flex:1;
background:#ffffff08;
margin:5px;
padding:14px;
border-radius:18px;
}

.box i{
font-size:22px;
margin-bottom:8px;
color:#ffd700;
}

.box p{
font-size:13px;
color:#ddd;
}

.footer{
text-align:center;
margin-top:20px;
font-size:12px;
color:#999;
}

</style>
</head>

<body>

<div class="bg1"></div>
<div class="bg2"></div>

<div class="container">

<div class="card">

<div class="top">

<div>
<div class="title">🕋 Qibla</div>
</div>

<div class="status">
LIVE
</div>

</div>

<div class="compass-wrapper">

<div class="compass">

<div class="ring"></div>

<div class="direction-label n">N</div>
<div class="direction-label s">S</div>
<div class="direction-label e">E</div>
<div class="direction-label w">W</div>

<div class="needle" id="needle"></div>

<div class="kaaba">🕋</div>

<div class="center-dot"></div>

</div>

</div>

<div class="degree-box">

<div class="degree" id="degree">
0°
</div>

<div class="small">
Facing Qibla Direction
</div>

</div>

<div class="location" id="location">
📍 Detecting your location...
</div>

<div class="buttons">

<button class="btn primary"
onclick="findQibla()">
Find Qibla
</button>

<button class="btn secondary"
onclick="vibratePhone()">
Vibrate
</button>

</div>

<div class="bottom">

<div class="box">
<i class="fa-solid fa-location-dot"></i>
<p>Live GPS</p>
</div>

<div class="box">
<i class="fa-solid fa-compass"></i>
<p>Compass</p>
</div>

<div class="box">
<i class="fa-solid fa-mosque"></i>
<p>Kaaba</p>
</div>

</div>

<div class="footer">
Premium Madrasa Qibla Finder
</div>

</div>

</div>

<script>

const kaabaLat = 21.4225;
const kaabaLng = 39.8262;

function toRadians(deg){
return deg * Math.PI / 180;
}

function toDegrees(rad){
return rad * 180 / Math.PI;
}

function calculateQibla(lat,lng){

const userLat = toRadians(lat);
const userLng = toRadians(lng);

const kaabaLatitude = toRadians(kaabaLat);
const kaabaLongitude = toRadians(kaabaLng);

const lngDiff = kaabaLongitude - userLng;

const y = Math.sin(lngDiff);

const x =
Math.cos(userLat) *
Math.tan(kaabaLatitude)
-
Math.sin(userLat) *
Math.cos(lngDiff);

let direction =
toDegrees(Math.atan2(y,x));

direction = (direction + 360) % 360;

return direction;
}

function rotateCompass(degree){

const needle =
document.getElementById("needle");

needle.style.transform =
`translate(-50%,-100%)
rotate(${degree}deg)`;

document.getElementById("degree")
.innerHTML =
degree.toFixed(1) + "°";

}

function findQibla(){

if(navigator.geolocation){

navigator.geolocation.getCurrentPosition(

function(position){

const lat =
position.coords.latitude;

const lng =
position.coords.longitude;

document.getElementById("location")
.innerHTML =
`📍 Latitude:
${lat.toFixed(4)}
<br>
📍 Longitude:
${lng.toFixed(4)}`;

const qibla =
calculateQibla(lat,lng);

rotateCompass(qibla);

navigator.vibrate(200);

},

function(){

alert("Location permission denied");

}

);

}else{

alert("Geolocation not supported");

}

}

function vibratePhone(){

if(navigator.vibrate){

navigator.vibrate([200,100,200]);

}

}

findQibla();

</script>

</body>
</html>
