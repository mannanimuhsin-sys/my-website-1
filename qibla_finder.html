.bg1{

.compass{
position:relative;
width:270px;
height:270px;
border-radius:50%;
background: radial-gradient(circle, rgba(255, 255, 255, 0.03), rgba(0, 0, 0, 0.4));
border: 6px solid #d4af37;
box-shadow: 
0 0 25px rgba(212, 175, 55, 0.25),
inset 0 0 25px rgba(0, 0, 0, 0.5);
cursor: grab;
transition: border-color 0.4s ease, box-shadow 0.4s ease;
user-select: none;
touch-action: none;
}

.compass:active {
cursor: grabbing;
}

/* Glowing aligned state */
.compass.aligned {
border-color: #0aff8d;
box-shadow: 
0 0 35px rgba(10, 255, 141, 0.6),
inset 0 0 30px rgba(10, 255, 141, 0.15);
animation: pulseGlow 2.0s infinite alternate;
}

@keyframes pulseGlow {
0% { box-shadow: 0 0 25px rgba(10, 255, 141, 0.4), inset 0 0 20px rgba(10, 255, 141, 0.1); }
100% { box-shadow: 0 0 45px rgba(10, 255, 141, 0.7), inset 0 0 40px rgba(10, 255, 141, 0.25); }
}

.compass-dial {
position: absolute;
width: 100%;
height: 100%;
will-change: transform;
transform-origin: center center;
transition: transform 0.15s cubic-bezier(0.1, 0.8, 0.3, 1);
}

.ring{
position:absolute;
inset:12px;
border: 2px dashed rgba(255, 255, 255, 0.08);
border-radius:50%;
pointer-events: none;
}

.center-dot{
position:absolute;
width:32px;
height:32px;
background: radial-gradient(circle, #ffd700, #bfa02c);
border: 3px solid #012413;
border-radius:50%;
top:50%;
left:50%;
transform:translate(-50%,-50%);
z-index:5;
box-shadow: 0 4px 10px rgba(0,0,0,0.4);
display: flex;
justify-content: center;
align-items: center;
pointer-events: none;
}

.center-dot::after {
content: '🌙';
font-size: 11px;
color: #012413;
margin-left: 1px;
}

/* Tick Marks on Compass Bezel */
.tick {
position: absolute;
width: 2px;
background: rgba(255, 255, 255, 0.2);
top: 50%;
left: 50%;
transform-origin: center center;
pointer-events: none;
}
.tick.minor { height: 6px; width: 1px; }
.tick.medium { height: 12px; background: rgba(212, 175, 55, 0.5); }
.tick.major { height: 16px; background: #ffd700; width: 3px; }

.needle{
position:absolute;
width: 5px;
height: 100px;
background: linear-gradient(to top, rgba(212,175,55,0.1) 40%, #ffd700 40%);
top:50%;
left:50%;
transform-origin: center bottom;
transform: translate(-50%,-100%) rotate(0deg);
border-radius: 4px 4px 0 0;
z-index:4;
filter: drop-shadow(0 0 6px rgba(255,215,0,0.6));
pointer-events: none;
transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.needle::before{
content:'✦';
position:absolute;
top:-15px;
left:50%;
transform:translateX(-50%);
color:#ffd700;
font-size:14px;
text-shadow: 0 0 6px #ffd700;
}

.qibla-marker {
position: absolute;
top:50%;
left:50%;
font-size:24px;
z-index: 5;
pointer-events: none;
filter: drop-shadow(0 0 10px rgba(255, 215, 0, 0.8));
transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.direction-label{
position:absolute;
font-size:15px;
font-weight:800;
color: rgba(255, 255, 255, 0.5);
pointer-events: none;
}

.n{ top:15px; left:50%; transform:translateX(-50%); color: #ffd700; font-size: 17px; text-shadow: 0 0 8px rgba(255,215,0,0.4); }
.s{ bottom:15px; left:50%; transform:translateX(-50%);}
.e{ right:18px; top:50%; transform:translateY(-50%);}
.w{ left:18px; top:50%; transform:translateY(-50%);}

/* Top stationary alignment notch */
.alignment-notch {
position: absolute;
top: -8px;
left: 50%;
transform: translateX(-50%);
color: #ffd700;
font-size: 18px;
z-index: 6;
filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
pointer-events: none;
}
.compass.aligned .alignment-notch {
color: #0aff8d;
animation: pulseNotch 1.5s infinite alternate;
}

@keyframes pulseNotch {
0% { transform: translateX(-50%) scale(1); filter: drop-shadow(0 0 2px #0aff8d); }
100% { transform: translateX(-50%) scale(1.2); filter: drop-shadow(0 0 8px #0aff8d); }
}

.degree-box{
background: rgba(255, 255, 255, 0.03);
border: 1px solid rgba(255, 255, 255, 0.05);
padding: 16px;
border-radius:20px;
transition: all 0.3s ease;
margin-bottom: 12px;
}

.degree-box.aligned {

border-color: rgba(10, 255, 141, 0.25);

.btn{

/* Manual Rotation Slider */
.manual-control {

border: 1px solid rgba(212, 175, 55, 0.15);
border-radius: 18px;
padding: 12px;
}

input[type="range"] {
-webkit-appearance: none;
appearance: none;
width: 100%;
margin-top: 8px;
}

input[type="range"]::-webkit-slider-runnable-track {
background: rgba(255, 255, 255, 0.1);
height: 6px;

input[type="range"]::-webkit-slider-thumb {

.home-link {

.footer{

/* Visual Toast */
.toast {

.toast.active {

</style>

<!-- Target Kaaba marker -->

</div>

<i class="fa-solid fa-mobile-screen-button"></i>

📍 Coordinates & Distance: Malappuram | 4,082 km

Manual Mode: Drag dial or use slider to rotate
</p>
<input type="range" id="heading-slider" min="0" max="359" value="0" oninput="onSliderChange(this.value)">
</div>

<i class="fa-solid fa-location-crosshairs"></i> Calibrate / Start Compass
</button>

<script>
// Kaaba Coordinates
const kaabaLat = 21.4225;
const kaabaLng = 39.8262;

// Initial States
let userLat = 11.0720;  // Default: Malappuram, Kerala
let userLng = 76.0740;  // Default: Malappuram, Kerala
let distanceToKaaba = 4082; 
let qiblaAngle = 292.4;    // Malappuram target Qibla bearing
let currentHeading = 0;    
let hasSensor = false;     
let wasAligned = false;    
let isAbsoluteMode = false; // Tracks absolute orientation sensor health

const compass = document.getElementById("compass");
const slider = document.getElementById("heading-slider");

// Math helpers
function toRadians(deg){ return deg * Math.PI / 180; }
function toDegrees(rad){ return rad * 180 / Math.PI; }

function calculateQibla(lat, lng){
const uLat = toRadians(lat);
const uLng = toRadians(lng);
const kLat = toRadians(kaabaLat);
const kLng = toRadians(kaabaLng);
const lngDiff = kLng - uLng;

const y = Math.sin(lngDiff);
const x = Math.cos(uLat) * Math.tan(kLat) - Math.sin(uLat) * Math.cos(lngDiff);
let direction = toDegrees(Math.atan2(y, x));
return (direction + 360) % 360;
}

function calculateDistance(lat1, lon1, lat2, lon2) {
const R = 6371; // Radius of Earth in km
const dLat = toRadians(lat2 - lat1);
const dLon = toRadians(lon2 - lon1);
const a = 
Math.sin(dLat / 2) * Math.sin(dLat / 2) +
Math.cos(toRadians(lat1)) * Math.cos(toRadians(lat2)) * 
Math.sin(dLon / 2) * Math.sin(dLon / 2);
const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
return R * c;
}

// Generate premium bezel ticks
function generateCompassTicks() {
const dial = document.getElementById("compass-dial");
for (let i = 0; i < 36; i++) {
const angle = i * 10;
const tick = document.createElement("div");
tick.className = "tick";
if (angle % 90 === 0) {
tick.classList.add("major");
} else if (angle % 30 === 0) {
tick.classList.add("medium");
} else {
tick.classList.add("minor");
}
tick.style.transform = `translate(-50%, -50%) rotate(${angle}deg) translateY(-115px)`;
dial.appendChild(tick);
}
}

// Synthesize nice chime on alignment
let audioCtx = null;
function playChime() {
try {
if (!audioCtx) {
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
if (audioCtx.state === 'suspended') {
audioCtx.resume();
}
const osc = audioCtx.createOscillator();
const gainNode = audioCtx.createGain();
osc.connect(gainNode);
gainNode.connect(audioCtx.destination);

osc.type = 'sine';
osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
osc.frequency.exponentialRampToValueAtTime(783.99, audioCtx.currentTime + 0.15); // G5
gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);

osc.start(audioCtx.currentTime);
osc.stop(audioCtx.currentTime + 0.6);
} catch(e) {
console.error(e);
}
}

// Render dynamic rotations
function updateCompassDOM() {
const dial = document.getElementById("compass-dial");
const needle = document.getElementById("needle");
const qiblaMarker = document.getElementById("qibla-marker");
const facingLabel = document.getElementById("facing-label");

// Rotate dial by -currentHeading so North is absolute North
dial.style.transform = `rotate(${-currentHeading}deg)`;

// Point needle relative to dial
needle.style.transform = `translate(-50%, -100%) rotate(${qiblaAngle}deg)`;

// Center Kaaba marker on dial circumference
qiblaMarker.style.transform = `translate(-50%, -50%) rotate(${qiblaAngle}deg) translateY(-102px) rotate(${-qiblaAngle}deg)`;

// Guide cues
let relAngle = (qiblaAngle - currentHeading + 360) % 360;
const minDiff = Math.min(Math.abs(currentHeading - qiblaAngle), 360 - Math.min(Math.abs(currentHeading - qiblaAngle)));

const cmp = document.getElementById("compass");
const degBox = document.getElementById("degree-box");
const card = document.getElementById("qibla-card");

if (minDiff <= 3.5) {
cmp.classList.add("aligned");
degBox.classList.add("aligned");
card.classList.add("aligned");
document.getElementById("degree").innerHTML = qiblaAngle.toFixed(1) + "°";
facingLabel.innerHTML = `<span style="color:#0aff8d; font-weight:bold;">✨ ഖിബ്‌ല ദിശ കൃത്യമാണ്! (Perfect) ✨</span>`;

if (!wasAligned) {
playChime();
if (navigator.vibrate) {
navigator.vibrate([200, 100, 200]);
}
wasAligned = true;
}
} else {
cmp.classList.remove("aligned");
degBox.classList.remove("aligned");
card.classList.remove("aligned");
document.getElementById("degree").innerHTML = qiblaAngle.toFixed(1) + "°";

if (relAngle > 3.5 && relAngle <= 180) {
facingLabel.innerHTML = `<span style="color:#ffd700;">വലത്തോട്ട് തിരിയുക ▶ (${minDiff.toFixed(0)}°)</span>`;
} else {
facingLabel.innerHTML = `<span style="color:#ffd700;">◀ ഇടത്തോട്ട് തിരിയുക (${minDiff.toFixed(0)}°)</span>`;
}
wasAligned = false;
}

if (slider) {
slider.value = Math.round(currentHeading);
}
}

// Sensor logic
function startCompassTracking() {
    // 1. Absolute sensor callback (Ideal for Android Chrome)
    const handleAbsoluteOrientation = (e) => {
        if (e.alpha !== null) {
            isAbsoluteMode = true;
            hasSensor = true;
            currentHeading = 360 - e.alpha; // standard W3C alpha is counter-clockwise
            document.getElementById("manual-control").style.display = "none";
            document.getElementById("app-status").innerHTML = "LIVE";
            document.getElementById("app-status").className = "status";
            updateCompassDOM();
        }
    };

    // 2. Standard sensor callback (Ideal for iOS Webkit)
    const handleStandardOrientation = (e) => {
        if (isAbsoluteMode) return; // Prioritise the absolute orientation sensor

        let heading = null;
        if (e.webkitCompassHeading !== undefined) {
            heading = e.webkitCompassHeading; // iOS Safari absolute heading
        } else if (e.absolute === true && e.alpha !== null) {
            heading = 360 - e.alpha;
        }

        if (heading !== null) {
            hasSensor = true;
            currentHeading = heading;
            document.getElementById("manual-control").style.display = "none";
            document.getElementById("app-status").innerHTML = "LIVE";
            document.getElementById("app-status").className = "status";
            updateCompassDOM();
        }
    };

    // Standard cross-device listener binding
    window.addEventListener("deviceorientationabsolute", handleAbsoluteOrientation, true);
    window.addEventListener("deviceorientation", handleStandardOrientation, true);

    // Timeout fallback verification
    setTimeout(() => {
        if (!hasSensor) {
            enableManualMode();
        }
    }, 1500);
}

function enableManualMode() {
    hasSensor = false;
    document.getElementById("manual-control").style.display = "block";
    document.getElementById("app-status").innerHTML = "MANUAL";
    document.getElementById("app-status").className = "status manual";
    updateCompassDOM();
}

function onSliderChange(val) {
    currentHeading = parseFloat(val);
    updateCompassDOM();
}

// Drag dial to rotate (Fallback)
let isDragging = false;
let startAngle = 0;
let startHeading = 0;

compass.addEventListener("mousedown", startDrag);
compass.addEventListener("touchstart", startDrag, { passive: true });

function startDrag(e) {
if (hasSensor) return;
isDragging = true;
const rect = compass.getBoundingClientRect();
const centerX = rect.left + rect.width / 2;
const centerY = rect.top + rect.height / 2;
const clientX = e.touches ? e.touches[0].clientX : e.clientX;
const clientY = e.touches ? e.touches[0].clientY : e.clientY;

startAngle = Math.atan2(clientY - centerY, clientX - centerX) * 180 / Math.PI;
startHeading = currentHeading;

document.addEventListener("mousemove", doDrag);
document.addEventListener("touchmove", doDrag, { passive: false });
document.addEventListener("mouseup", stopDrag);
document.addEventListener("touchend", stopDrag);
}

function doDrag(e) {
if (!isDragging) return;
if (e.cancelable) e.preventDefault();
const rect = compass.getBoundingClientRect();
const centerX = rect.left + rect.width / 2;
const centerY = rect.top + rect.height / 2;
const clientX = e.touches ? e.touches[0].clientX : e.clientX;
const clientY = e.touches ? e.touches[0].clientY : e.clientY;

const currentAngle = Math.atan2(clientY - centerY, clientX - centerX) * 180 / Math.PI;
let angleDiff = currentAngle - startAngle;

let newHeading = (startHeading - angleDiff + 360) % 360;
currentHeading = newHeading;
updateCompassDOM();
}

function stopDrag() {
isDragging = false;
document.removeEventListener("mousemove", doDrag);
document.removeEventListener("touchmove", doDrag);
document.removeEventListener("mouseup", stopDrag);
document.removeEventListener("touchend", stopDrag);
}

// Calibrate Location & Sensor Trigger
function findQibla() {
    if (navigator.geolocation) {
        showToast("ലൊക്കേഷൻ പരിശോധിക്കുന്നു (GPS)...");
        navigator.geolocation.getCurrentPosition(
            function(position) {
                userLat = position.coords.latitude;
                userLng = position.coords.longitude;
                qiblaAngle = calculateQibla(userLat, userLng);
                distanceToKaaba = calculateDistance(userLat, userLng, kaabaLat, kaabaLng);

                document.getElementById("location").innerHTML = `
                    📍 Malappuram | Lat: ${userLat.toFixed(2)}° | Lng: ${userLng.toFixed(2)}° | ${distanceToKaaba.toLocaleString(undefined, {maximumFractionDigits: 0})} km
                `;
                showToast("ലൊക്കേഷൻ അപ്‌ഡേറ്റ് ചെയ്തു! ഖിബ്‌ല കണ്ടെത്തി.");
                updateCompassDOM();
                requestCompassPermission();
            },
            function(err) {
                console.warn(err);
                showToast("ലൊക്കേഷൻ തടസ്സപ്പെട്ടു. കേരള ലൊക്കേഷൻ ഉപയോഗിക്കുന്നു.");
                fallbackCoordinates();
                requestCompassPermission();
            },
            { enableHighAccuracy: true, timeout: 5000 }
        );
    } else {
        fallbackCoordinates();
        requestCompassPermission();
    }
}

function fallbackCoordinates() {
    userLat = 11.0720;
    userLng = 76.0740;
    qiblaAngle = calculateQibla(userLat, userLng);
    distanceToKaaba = calculateDistance(userLat, userLng, kaabaLat, kaabaLng);
    document.getElementById("location").innerHTML = `
        📍 Malappuram | Lat: ${userLat.toFixed(2)}° | Lng: ${userLng.toFixed(2)}° | ${distanceToKaaba.toLocaleString(undefined, {maximumFractionDigits: 0})} km
    `;
    updateCompassDOM();
}

async function requestCompassPermission() {
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
            const state = await DeviceOrientationEvent.requestPermission();
            if (state === 'granted') {
                startCompassTracking();
            } else {
                showToast("കോമ്പസ് അനുമതി ലഭ്യമല്ല. മാനുവൽ മോഡ് ആക്റ്റീവ്.");
                enableManualMode();
            }
        } catch(e) {
            console.error(e);
            enableManualMode();
        }
    } else {
        startCompassTracking();
    }
}

// Visual Toast System
function showToast(message) {
    let toast = document.getElementById("toast");
    if (!toast) {
        toast = document.createElement("div");
        toast.id = "toast";
        toast.className = "toast";
        document.body.appendChild(toast);
    }
    toast.innerHTML = `<i class="fa-solid fa-circle-check"></i> ${message}`;
    toast.classList.add("active");
    setTimeout(() => {
        toast.classList.remove("active");
    }, 2500);
}

// Initialise page components
window.addEventListener("DOMContentLoaded", () => {
    generateCompassTicks();
    fallbackCoordinates(); // Initialize with Malappuram coordinates initially
    findQibla();
});

</script>
